name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  push:
    paths:
      - ".github/workflows/profile-cards.yml" # run right after this file is added or changed
  workflow_dispatch: # run manually from the Actions tab

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&border_radius=10&bg_color=0D1117&title_color=FF8C42&icon_color=FF8C42&ring_color=FF8C42&text_color=C9D1D9"
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=javascript,cpp,python&hide_border=true&border_radius=10&bg_color=0D1117&title_color=FF8C42&text_color=C9D1D9"
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: "user=${{ github.repository_owner }}&hide_border=true&border_radius=10&background=0D1117&stroke=30363D&ring=FF8C42&fire=FF8C42&currStreakNum=FFFFFF&currStreakLabel=FF8C42&sideNums=FFFFFF&sideLabels=FF8C42&dates=8B949E"
          path: profile/streak.svg
          token: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?color_snake=#FF8C42&color_dots=#161B22,#5A2D0C,#9C4A12,#E0661A,#FFA94D
            profile/snake-light.svg?color_snake=#E05A00&color_dots=#EBEDF0,#FFD8B0,#FFB066,#FF8C2A,#D95F00

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
